{% extends "pydata_sphinx_theme/layout.html" %}

{% block body_tag %}
<body data-default-mode="{{ default_mode }}"{% if pagename == 'index' %} class="vf-home"{% endif %}>
{% endblock %}

{% block docs_navbar %}
{{ super() }}
{% if pagename == 'index' %}{% include "hero.html" %}{% endif %}
{% endblock %}

{% block docs_body %}
{{ super() }}

{% if pagename != 'index' %}
<!-- giscus -->
<script>
(function () {
  var giscusTheme = function () {
    return document.documentElement.dataset.theme === "dark" ? "transparent_dark" : "light";
  };

  var script = document.createElement("script");
  script.setAttribute("src", "https://giscus.app/client.js");
  script.setAttribute("data-repo", "vferat/vferat.github.io");
  script.setAttribute("data-repo-id", "R_kgDOIMr2YA");
  script.setAttribute("data-category", "Q&A");
  script.setAttribute("data-category-id", "DIC_kwDOIMr2YM4CR7_W");
  script.setAttribute("data-mapping", "pathname");
  script.setAttribute("data-strict", "0");
  script.setAttribute("data-reactions-enabled", "1");
  script.setAttribute("data-emit-metadata", "1");
  script.setAttribute("data-input-position", "top");
  script.setAttribute("data-theme", giscusTheme());
  script.setAttribute("data-lang", "en");
  script.setAttribute("data-loading", "lazy");
  script.setAttribute("crossorigin", "anonymous");
  script.async = true;
  document.getElementsByClassName("bd-article-container")[0].appendChild(script);

  // Keep the comments in sync with the light/dark switch.
  new MutationObserver(function () {
    var frame = document.querySelector("iframe.giscus-frame");
    if (frame) {
      frame.contentWindow.postMessage({ giscus: { setConfig: { theme: giscusTheme() } } }, "https://giscus.app");
    }
  }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
})();
</script>
{% endif %}
{% endblock %}
